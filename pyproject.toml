[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-debug-assist"
version = "0.1.0"
description = "Learning-grade replica of Uber's Debug Assist debugging-agent harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "saran", email = "saran@example.com"}
]
dependencies = [
    # Web framework for demo app
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    
    # LangGraph orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    
    # Observability (optional)
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    
    # Utilities
    "python-json-logger>=2.0.7",
    "PyGithub>=2.1.1",
    "pyyaml>=6.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
]
infra = [
    "aws-cdk-lib>=2.110.0",
    "constructs>=10.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demo_app*", "agent*", "mcp_servers*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
