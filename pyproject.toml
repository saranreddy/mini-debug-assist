[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-debug-assist"
version = "0.1.0"
description = "Learning-grade replica of Uber's Debug Assist debugging-agent harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "saran", email = "saran@example.com"}
]
# Pinned to the versions the test suite and CI run against (known good).
# The MCP servers use the mcp 1.x server API (decorators removed in mcp 2.x),
# so mcp stays on 1.x. Bump deliberately and re-run `make test`.
dependencies = [
    # Web framework for demo app
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",

    # LangGraph orchestration
    "langgraph==1.2.14",
    "langchain==1.4.3",
    "langchain-aws==1.8.0",

    # AWS SDK
    "boto3==1.43.108",
    "botocore==1.43.108",

    # MCP (Model Context Protocol)
    "mcp==1.30.0",

    # Testing
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",

    # Observability (optional)
    "langsmith==0.14.4",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",

    # Utilities
    "python-json-logger==4.2.0",
    "PyGithub==2.10.0",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
]
infra = [
    "aws-cdk-lib==2.150.0",
    "constructs==10.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demo_app*", "agent*", "mcp_servers*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
